  lines.forEach(function(line, i) {
    fillTextSpaced(offCtx, line, anchorX, startY + i * lineHeight, letterSpacing, align);
  });

  offCtx.textAlign = align;

  textData = offCtx.getImageData(0, 0, w, h).data;
  lastText = text; lastFont = fontStr; lastW = w; lastH = h; lastFontSize = fontSize; lastAlign = align; lastLetterSpacing = letterSpacing; lastLineSpacing = lineSpacing;
}

function draw() {
  const w = canvas.width;
  const h = canvas.height;
  if (w === 0 || h === 0) { requestAnimationFrame(draw); return; }

  ctx.clearRect(0, 0, w, h);
  updateTextMap(w, h);

  const spacing = controls.get('spacing') || 8;
  const baseWeight = controls.get('baseWeight') || 0.5;
  const thicknessStep = controls.get('thicknessStep') || 5;
  const overshoot = controls.get('overshoot') || 40;
  const color = controls.getColorWithAlpha('color');
  const repelStrength = controls.get('waveAmplitude') || 30;
  const repelRadius = controls.get('waveRadius') || 150;
  const easeSpeed = controls.get('waveEase') || 0.12;

  const medWeight = baseWeight + thicknessStep;
  const thickWeight = baseWeight + thicknessStep * 2;

  const numLines = Math.floor(h / spacing);
  const totalHeight = numLines * spacing;
  const offsetY = Math.floor((h - totalHeight) / 2);

  const sampleStep = 2;
  const cols = Math.ceil(w / sampleStep);
  const overshootCols = Math.ceil(overshoot / sampleStep);

  ctx.strokeStyle = color;
  ctx.lineCap = 'round';

  const taperEnabled = controls.get('taperEnabled');
  const taperLen = controls.get('taperLength') || 20;
  const stretchFill = controls.get('stretchFill');

  // Ensure displacement array matches line count
  if (lineDisplacements.length !== numLines) {
    lineDisplacements = new Array(numLines).fill(0);
  }

  // Calculate target displacements based on mouse proximity
  let anyMoving = false;
  for (let i = 0; i < numLines; i++) {
    const baseY = offsetY + i * spacing + Math.floor(spacing / 2);
    let target = 0;

    if (mouseActive) {
      const dy = baseY - mouseY;
      const absDy = Math.abs(dy);
      if (absDy < repelRadius) {
        // Smooth falloff: strongest near cursor, fades to zero at radius
        const t = 1 - (absDy / repelRadius);
        const ease = t * t * (3 - 2 * t); // smoothstep
        const sign = dy >= 0 ? 1 : -1;
        target = sign * repelStrength * ease;
      }
    }

    // Ease toward target
    const diff = target - lineDisplacements[i];
    lineDisplacements[i] += diff * easeSpeed;

    // Snap to zero when very close
    if (Math.abs(lineDisplacements[i]) < 0.05 && target === 0) {
      lineDisplacements[i] = 0;
    } else {
      anyMoving = true;
    }
  }

  function drawLine(x1, x2, y, lw) {
    if (x2 - x1 <= 0) return;
    ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.moveTo(x1, y + 0.5);
    ctx.lineTo(x2, y + 0.5);
    ctx.stroke();
  }

  function drawTaper(x1, x2, y, w1, w2, steps) {
    const len = x2 - x1;
    if (len <= 0) return;
    const segLen = len / steps;
    for (let s = 0; s < steps; s++) {
      const t = (s + 0.5) / steps;
      const ease = t * t * (3 - 2 * t);
      const lw = w1 + (w2 - w1) * ease;
      drawLine(x1 + s * segLen, x1 + (s + 1) * segLen, y, lw);
    }
  }

  const taperSteps = Math.max(4, Math.ceil(taperLen / 3));

  for (let i = 0; i < numLines; i++) {
    const baseY = offsetY + i * spacing + Math.floor(spacing / 2);
    const y = baseY + lineDisplacements[i];
    const sampleY = Math.min(Math.max(Math.floor(baseY), 0), h - 1);

    const rawWeights = new Float32Array(cols);
    for (let j = 0; j < cols; j++) {
      const sx = Math.min(Math.max(j * sampleStep, 0), w - 1);
      const idx = (sampleY * w + sx) * 4 + 3;
      rawWeights[j] = textData[idx] / 255;
    }

    // Find text regions
    const textRegions = [];
    let inRegion = false;
    let regionStart = 0;
    for (let j = 0; j < cols; j++) {
      if (rawWeights[j] > 0.05) {
        if (!inRegion) { inRegion = true; regionStart = j; }
      } else {
        if (inRegion) { inRegion = false; textRegions.push([regionStart, j - 1]); }
      }
    }
    if (inRegion) textRegions.push([regionStart, cols - 1]);

    if (textRegions.length === 0) {
      drawLine(0, w, y, baseWeight);
      continue;
    }

    // Expanded regions (overshoot)
    const expanded = [];
    for (const [rs, re] of textRegions) {
      const es = Math.max(0, rs - overshootCols);
      const ee = Math.min(cols - 1, re + overshootCols);
      if (expanded.length > 0 && es <= expanded[expanded.length - 1][1] + 1) {
        expanded[expanded.length - 1][1] = Math.max(expanded[expanded.length - 1][1], ee);
      } else {
        expanded.push([es, ee]);
      }
    }

    // Thick regions
    const thickRegionsList = [];
    let inThick = false;
    let thickStart = 0;
    for (let j = 0; j < cols; j++) {
      if (rawWeights[j] > 0.4) {
        if (!inThick) { inThick = true; thickStart = j; }
      } else {
        if (inThick) { inThick = false; thickRegionsList.push([thickStart, j - 1]); }
      }
    }
    if (inThick) thickRegionsList.push([thickStart, cols - 1]);

    // Base thin line
    drawLine(0, w, y, baseWeight);

    if (!taperEnabled) {
      for (const [es, ee] of expanded) {
        drawLine(es * sampleStep, Math.min(ee * sampleStep, w), y, medWeight);
      }
      for (const [ts, te] of thickRegionsList) {
        drawLine(ts * sampleStep, Math.min(te * sampleStep, w), y, thickWeight);
      }
    } else {
      for (const [es, ee] of expanded) {
        const sx = es * sampleStep;
        const ex = Math.min(ee * sampleStep, w);
        const segLen = ex - sx;
        const tp = Math.min(taperLen, segLen / 2);
        drawTaper(sx, sx + tp, y, baseWeight, medWeight, taperSteps);
        if (sx + tp < ex - tp) drawLine(sx + tp, ex - tp, y, medWeight);
        drawTaper(ex - tp, ex, y, medWeight, baseWeight, taperSteps);
      }

      for (const [ts, te] of thickRegionsList) {
        const sx = ts * sampleStep;
        const ex = Math.min(te * sampleStep, w);
        const segLen = ex - sx;
        const tp = Math.min(taperLen, segLen / 2);
        drawTaper(sx, sx + tp, y, medWeight, thickWeight, taperSteps);
        if (sx + tp < ex - tp) drawLine(sx + tp, ex - tp, y, thickWeight);
        drawTaper(ex - tp, ex, y, thickWeight, medWeight, taperSteps);
      }
    }
  }

  // Stretch fill: draw vertical fills between adjacent lines in thick regions
  if (stretchFill) {
    ctx.fillStyle = color;
    for (let i = 0; i < numLines - 1; i++) {
      const baseY1 = offsetY + i * spacing + Math.floor(spacing / 2);
      const baseY2 = offsetY + (i + 1) * spacing + Math.floor(spacing / 2);
      const y1 = baseY1 + lineDisplacements[i];
      const y2 = baseY2 + lineDisplacements[i + 1];
      const sampleY1 = Math.min(Math.max(Math.floor(baseY1), 0), h - 1);
      const sampleY2 = Math.min(Math.max(Math.floor(baseY2), 0), h - 1);

      // Find columns where BOTH lines have thick weight (inside letter)
      let inFill = false;
      let fillStart = 0;
      for (let j = 0; j < cols; j++) {
        const sx = Math.min(Math.max(j * sampleStep, 0), w - 1);
        const idx1 = (sampleY1 * w + sx) * 4 + 3;
        const idx2 = (sampleY2 * w + sx) * 4 + 3;
        const both = (textData[idx1] / 255 > 0.4) && (textData[idx2] / 255 > 0.4);
        if (both) {
          if (!inFill) { inFill = true; fillStart = j; }
        } else {
          if (inFill) {
            inFill = false;
            const fx = fillStart * sampleStep;
            const fw = (j - fillStart) * sampleStep;
            const topY = y1 + thickWeight / 2;
            const botY = y2 - thickWeight / 2;
            if (botY > topY) {
              ctx.fillRect(fx, topY, fw, botY - topY);
            }
          }
        }
      }
      if (inFill) {
        const fx = fillStart * sampleStep;
        const fw = (cols - fillStart) * sampleStep;
        const topY = y1 + thickWeight / 2;
        const botY = y2 - thickWeight / 2;
        if (botY > topY) {
          ctx.fillRect(fx, topY, fw, botY - topY);
        }
      }
    }
  }

  // Continue animation if lines are still moving
  if (anyMoving || mouseActive) {
    animFrameId = requestAnimationFrame(draw);
  } else {
    animFrameId = null;
  }
}

let animFrameId = null;

function startLoop() {
  if (!animFrameId) {
    animFrameId = requestAnimationFrame(draw);
  }
}

// Initial render
draw();

// React to control changes
controls.onAny(function() {
  needsRedraw = true;
  if (!animFrameId) draw();
});

window.addEventListener('resize', function() {
  lastFont = '';
  textData = null;
  if (!animFrameId) draw();
});

// Kick animation loop when mouse moves (if not already running)
canvas.addEventListener('mousemove', function() {
  startLoop();
}, { passive: true });

canvas.addEventListener('touchmove', function() {
  startLoop();
}, { passive: true });

  </script>
